name: StockPilot CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stockpilot-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io/not-so-shubh
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stockpilot_test
          POSTGRES_USER: stockpilot
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U stockpilot -d stockpilot_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://stockpilot:ephemeral-ci-only@localhost:5432/stockpilot_test
      TEST_DATABASE_URL: postgresql+psycopg://stockpilot:ephemeral-ci-only@localhost:5432/stockpilot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - name: Install locked backend tools
        run: pip install --require-hashes -r backend/requirements-dev.txt
      - name: Lint and format gate
        run: |
          ruff check backend
          ruff format --check backend
      - name: Verify PostgreSQL migrations and model consistency
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: PostgreSQL integration tests and coverage
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml | tee ../docs/evidence/pytest-postgres.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Frontend lint tests and production build
        run: |
          npm --prefix frontend ci --ignore-scripts
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix frontend run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-evidence
          path: |
            docs/evidence/pytest-postgres.txt
            backend/coverage.xml
          retention-days: 30
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12'}
      - name: Install validation tools
        run: |
          pip install --require-hashes -r backend/requirements-dev.txt
          curl -fsSLo /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.14.7/terraform_1.14.7_linux_amd64.zip
          unzip -q /tmp/terraform.zip -d /tmp/terraform-cli
          sudo install /tmp/terraform-cli/terraform /usr/local/bin/terraform
          curl -fsSL https://get.helm.sh/helm-v3.20.1-linux-amd64.tar.gz | tar -xz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Terraform formatting initialization validation and offline topology test
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -input=false -lockfile=readonly
          terraform -chdir=terraform validate -no-color | tee docs/evidence/terraform-ci-validate.txt
          terraform -chdir=terraform test -no-color | tee docs/evidence/terraform-ci-mock-test.txt
      - name: Helm schema and service wiring
        run: |
          helm lint helm/stockpilot --set backend.tag=${{ github.sha }} --set frontend.tag=${{ github.sha }}
          helm template stockpilot helm/stockpilot -n stockpilot -f helm/stockpilot/values-prod.yaml --set backend.tag=${{ github.sha }} --set frontend.tag=${{ github.sha }} > /tmp/stockpilot.yaml
          python scripts/verify-manifests.py /tmp/stockpilot.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: infrastructure-evidence
          path: docs/evidence/terraform-ci-*.txt
          retention-days: 30
  compose:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24'}
      - name: Start complete PostgreSQL stack
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 180
          docker compose exec -T backend python -m app.seed
          docker compose ps | tee docs/evidence/compose-ci.txt
          python scripts/smoke.py | tee docs/evidence/compose-smoke.txt
          curl --fail http://localhost:8000/metrics > docs/evidence/metrics.txt
          test "$(docker compose exec -T backend id -u)" = 10001
          test "$(docker compose exec -T frontend id -u)" = 101
      - name: Real browser acceptance on desktop and mobile
        run: |
          npm --prefix e2e ci
          cd e2e
          npx playwright install --with-deps chromium
          npm test
      - name: Capture diagnostics
        if: always()
        run: docker compose logs --no-color > docs/evidence/compose-ci.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compose-browser-evidence
          path: |
            docs/evidence/compose-ci*
            docs/evidence/compose-smoke.txt
            docs/evidence/metrics.txt
            docs/evidence/frontend-*.png
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 30
      - name: Clean up CI database
        if: always()
        run: docker compose down -v --remove-orphans
  build-security:
    needs: [quality, infrastructure, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build immutable candidate image
        run: docker build --pull --label org.opencontainers.image.source=https://github.com/not-so-shubh/devops-project --label org.opencontainers.image.revision=${{ github.sha }} -t $REGISTRY/stockpilot-${{ matrix.component }}:${{ github.sha }} ./${{ matrix.component }}
      - name: Scan OS and application vulnerabilities (blocking HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/not-so-shubh/stockpilot-${{ matrix.component }}:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: trivy-${{ matrix.component }}.json
      - name: Print actual scan findings
        if: always()
        run: |
          if test -f trivy-${{ matrix.component }}.json; then
            jq '[.Results[]? | {Target, Vulnerabilities: [.Vulnerabilities[]? | {VulnerabilityID, PkgName, InstalledVersion, FixedVersion, Severity, Title}]}]' trivy-${{ matrix.component }}.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-${{ matrix.component }}
          path: trivy-${{ matrix.component }}.json
          retention-days: 30
      - name: Export scanned image
        run: docker save $REGISTRY/stockpilot-${{ matrix.component }}:${{ github.sha }} -o ${{ matrix.component }}.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.component }}
          path: ${{ matrix.component }}.tar
          retention-days: 1
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read, packages: write}
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: 'image-${{ matrix.component }}'}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact scanned SHA image
        run: |
          docker load -i ${{ matrix.component }}.tar
          docker push $REGISTRY/stockpilot-${{ matrix.component }}:${{ github.sha }}
  kubernetes:
    needs: build-security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: 'image-*', merge-multiple: true}
      - name: Create isolated free Kubernetes test cluster
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo install /tmp/kind /usr/local/bin/kind
          curl -fsSL https://get.helm.sh/helm-v3.20.1-linux-amd64.tar.gz | tar -xz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          kind create cluster --name stockpilot --wait 180s
          for component in backend frontend; do
            docker load -i "$component.tar"
            kind load docker-image "$REGISTRY/stockpilot-$component:${{ github.sha }}" --name stockpilot
          done
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply -f k8s/namespace.yaml
          python scripts/ci-cluster-secrets.py
      - name: Install ingress metrics provider and monitoring
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm upgrade --install traefik traefik/traefik --version 42.0.0 -n ingress-system --create-namespace -f monitoring/traefik-values.yaml --set service.type=ClusterIP --wait --timeout 5m
          # Insecure kubelet TLS is confined to this disposable kind cluster.
          helm upgrade --install metrics-server metrics-server/metrics-server --version 3.14.0 -n kube-system -f monitoring/metrics-server-kind.yaml --wait --timeout 5m
          kubectl create configmap stockpilot-dashboard -n monitoring --from-file=stockpilot-dashboard.json=monitoring/stockpilot-dashboard.json --dry-run=client -o yaml | kubectl apply -f -
          kubectl label configmap stockpilot-dashboard -n monitoring grafana_dashboard=1 --overwrite
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack --version 92.10.1 -n monitoring --create-namespace -f monitoring/prometheus-values.yaml --wait --timeout 8m
      - name: Deploy Helm release and verify workload network and HPA
        run: |
          helm upgrade --install stockpilot helm/stockpilot -n stockpilot -f helm/stockpilot/values-prod.yaml --set backend.tag=${{ github.sha }} --set frontend.tag=${{ github.sha }} --set ingress.host=localhost --set postgres.storageClass=standard --wait --wait-for-jobs --timeout 6m
          kubectl rollout status deployment/stockpilot-backend -n stockpilot --timeout=180s
          kubectl rollout status deployment/stockpilot-frontend -n stockpilot --timeout=180s
          kubectl scale deployment stockpilot-backend -n stockpilot --replicas=2
          kubectl rollout status deployment/stockpilot-backend -n stockpilot --timeout=180s
          kubectl exec -n stockpilot deployment/stockpilot-backend -- python -m app.seed
          kubectl get pods,svc,ingress,hpa -n stockpilot | tee docs/evidence/kubernetes-ci.txt
          helm list -n stockpilot | tee docs/evidence/helm-release-ci.txt
          kubectl top pods -n stockpilot | tee docs/evidence/hpa-metrics-ci.txt
          kubectl port-forward -n ingress-system svc/traefik 3000:80 >/tmp/ingress.log 2>&1 &
          kubectl port-forward -n monitoring svc/monitoring-kube-prometheus-prometheus 9090:9090 >/tmp/prometheus.log 2>&1 &
          kubectl port-forward -n monitoring svc/monitoring-grafana 3001:80 >/tmp/grafana.log 2>&1 &
          sleep 5
          BASE_URL=http://localhost:3000 python scripts/smoke.py
          BASE_URL=http://localhost:3000 REQUESTS=90 bash scripts/load-test.sh
          python scripts/verify-monitoring.py
      - name: Browser verification through actual Ingress
        run: |
          npm --prefix e2e ci
          cd e2e
          npx playwright install --with-deps chromium
          npm test
          node ../scripts/capture-monitoring.mjs
      - name: Kubernetes diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide > docs/evidence/cluster-pods-ci.txt
          kubectl get events -A --sort-by=.lastTimestamp > docs/evidence/cluster-events-ci.txt
          kubectl logs -n stockpilot -l app.kubernetes.io/component=migration --all-containers=true > docs/evidence/migration-ci.log || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kubernetes-monitoring-evidence
          path: |
            docs/evidence/*-ci*
            docs/evidence/frontend-*.png
            docs/evidence/prometheus-*.json
            docs/evidence/grafana-*.png
            docs/evidence/prometheus-*.png
            e2e/playwright-report/
          retention-days: 30
      - name: Delete disposable cluster
        if: always()
        run: kind delete cluster --name stockpilot
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
    needs: [publish, kubernetes]
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-24.04' }}
    environment: production
    timeout-minutes: 20
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Authenticate to the authorized EKS cluster
        env:
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
        run: aws eks update-kubeconfig --region ap-south-1 --name "$EKS_CLUSTER_NAME"
      - name: Install Helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.20.1-linux-amd64.tar.gz | tar -xz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Upgrade to exact published commit
        env:
          INGRESS_HOST: ${{ vars.INGRESS_HOST }}
        run: |
          test -n "$INGRESS_HOST"
          kubectl get secret stockpilot-db -n stockpilot
          helm upgrade --install stockpilot helm/stockpilot -n stockpilot -f helm/stockpilot/values-prod.yaml --set backend.tag=${{ github.sha }} --set frontend.tag=${{ github.sha }} --set-string ingress.host="$INGRESS_HOST" --wait --wait-for-jobs --timeout 10m
          kubectl rollout status deployment/stockpilot-backend -n stockpilot --timeout=180s
          kubectl rollout status deployment/stockpilot-frontend -n stockpilot --timeout=180s
