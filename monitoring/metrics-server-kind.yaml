# Only for disposable kind: its kubelet certificates are self-signed.
# EKS installation uses the chart's secure defaults, without insecure TLS.
args:
  - --cert-dir=/tmp
  - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
  - --kubelet-use-node-status-port
  - --metric-resolution=15s
  - --kubelet-insecure-tls
