        name: stockpilot
        namespace: flux-system
      valuesFiles:
        - ./helm/stockpilot/values.yaml
        - ./helm/stockpilot/values-prod.yaml
  values:
    backend:
      tag: "9462f34dc3c8f6321af23a85d11296d980839595"
    frontend:
      tag: "9462f34dc3c8f6321af23a85d11296d980839595"
