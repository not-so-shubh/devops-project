kind: HelmRelease
metadata:
  name: stockpilot
  namespace: stockpilot
spec:
  # Tested/published in Actions run 39045365598; resume after cluster bootstrap.
  suspend: true
  interval: 2m
  timeout: 10m
  chart:
    spec:
      chart: ./helm/stockpilot
      reconcileStrategy: Revision
      sourceRef:
