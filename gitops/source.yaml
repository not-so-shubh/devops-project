apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: stockpilot
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/not-so-shubh/devops-project
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stockpilot
  namespace: flux-system
spec:
  interval: 2m
  path: ./gitops/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: stockpilot
  # Namespace and external secrets must already exist; no secret material is stored in Git.
