environment: production
backend:
  replicas: 2
frontend:
  replicas: 2
postgres:
  # Capstone EKS demo database, not an HA production database.
  # For a real production environment set false and supply an external TLS database URL.
  enabled: true
  storageClass: gp3
ingress:
  enabled: true
  host: stockpilot.local
hpa:
  enabled: true
monitoring:
  serviceMonitor:
    enabled: true
    release: monitoring
